<!DOCTYPE html>
<html lang="en">

<body>
<main>

    <section>

        <h2>Student Login</h2>

        <form>

            <label for="username">Email / Username</label>
            <input
                type="text"
                id="username"
                name="username"
                required
            >

            <br><br>

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            >

            <br><br>

            <button type="submit">Login</button>

        </form>

        <p>
            Don't have an account?
            <a href="register.html">Register here</a>
        </p>

    </section>

</main>
</body>
</html>
